name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: biblioteca
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d biblioteca"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verificar variables
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "DB_URL=$DB_URL"
          echo "DB_USERNAME=$DB_USERNAME"

          if [ -n "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD está configurado"
          else
            echo "DB_PASSWORD NO está configurado"
            exit 1
          fi
      - name: Probar conexión PostgreSQL
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          PGPASSWORD="$PGPASSWORD" psql \
            -h localhost \
            -p 5432 \
            -U postgres \
            -d biblioteca \
            -c "SELECT 1;"
      - name: Ejecutar pruebas
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: mvn clean test

      - name: Construir aplicación
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: mvn clean package -DskipTests

      - name: Construir imagen Docker
        run: docker build -t ghcr.io/${{ github.repository_owner }}/biblioteca-api:latest .

      - name: Publicar imagen en GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/biblioteca-api:latest
